name: Check workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r skills/wechat-brand-layout/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check plugins/ll-xiumi-importer/popup.js
      - run: node --check plugins/ll-xiumi-importer/page-runtime.js
      - run: python scripts/package_workflow.py
